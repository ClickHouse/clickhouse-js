name: "misc"

permissions: {}
# Hourly rather than on every push: dropping databases one by one takes a
# while, and the script only drops ones older than TTL_MINUTES anyway. Run it
# manually (workflow_dispatch) to clean up sooner, e.g. after a burst of runs.
on:
  workflow_dispatch:
  schedule:
    # Not at minute 0: scheduled runs at the start of an hour are the most
    # likely to be delayed or dropped, as that is when GitHub's load peaks.
    - cron: "17 * * * *"

# One cleanup at a time. A running one is not cancelled by a newer run, which
# would cut a long cleanup short; any extra run waits instead. A stuck run is
# ended by the job's timeout-minutes below, so it cannot block the queue.
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  # Runs in parallel with the rest of the tests, there shoudl be no dependencies on it,
  # and it should run even if other tests fail, to ensure that we keep the ClickHouse Cloud
  # instance clean for the next runs to avoid adding cleanup cost to the critical path of the tests.
  cloud-cleanup:
    # Cloud secrets are not available for Dependabot pushes; skip the cleanup in that case.
    if: ${{ always() && github.triggering_actor != 'dependabot[bot]' }}
    # The longest cleanup so far, of a ~2,800-database backlog, took ~20
    # minutes. Ending before the next hourly run keeps the queue moving;
    # databases dropped before a timeout stay dropped, and the next run
    # continues with the rest.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Cleanup old databases in ClickHouse Cloud
        env:
          CLICKHOUSE_CLOUD_HOST: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_HOST_SMT_PROD }}
          CLICKHOUSE_CLOUD_PASSWORD: ${{ secrets.INTEGRATIONS_TEAM_TESTS_CLOUD_PASSWORD_SMT_PROD }}
          PREFIX: clickhousejs_
          TTL_MINUTES: 60
        run: |
          node .scripts/cleanup_old_databases.mjs
