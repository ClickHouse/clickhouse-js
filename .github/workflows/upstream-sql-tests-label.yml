name: "upstream-sql-tests-label"

# Runs upstream-sql-tests.yml on a PR when a maintainer adds the
# `tests:run-core-sql` label. Use it for a PR that does not start that workflow
# itself, for example a change in a client. The run removes the label when it
# ends, so to run the tests again, add the label again.

permissions: {}
on:
  # Not pull_request_target: the tests need no secrets, and pull_request runs
  # the code of a fork with a read-only token. The `paths` filter of the
  # pull_request trigger in upstream-sql-tests.yml also applies to a `labeled`
  # event, so the label needs this workflow of its own.
  pull_request:
    types: [labeled]

jobs:
  upstream-sql-tests:
    if: ${{ github.event.label.name == 'tests:run-core-sql' }}
    uses: ./.github/workflows/upstream-sql-tests.yml
    # The same as the top-level permissions of upstream-sql-tests.yml. A called
    # workflow never gets more permissions than its caller.
    permissions: {}

  remove-label:
    # Lets a maintainer run the tests again by adding the label again. The
    # token of a PR from a fork cannot write: remove the label by hand there.
    # A separate job, so that the PR code in upstream-sql-tests never gets a
    # token that can write.
    needs: upstream-sql-tests
    if: ${{ always() && github.event.label.name == 'tests:run-core-sql' && github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the tests:run-core-sql label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/issues/$PR/labels/tests%3Arun-core-sql" -X DELETE || true
