name: "format"

# Checks the formatting of the whole repository with Prettier.
#
# This workflow has no `paths` filter, so it runs for every PR. The test
# workflows (for example `tests-node.yml`) run only when the packages change.
# Before, the Prettier check was part of `tests-node.yml`. A PR that changed
# only other files (agent skills, docs, examples, workflows) was not checked,
# and the next PR that changed a package failed for a file it did not change.

permissions: {}
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  # Network resilience: npm's default of 2 fetch retries is not enough for
  # the transient registry errors (ECONNRESET) we regularly hit in CI.
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"
  NPM_CONFIG_FETCH_TIMEOUT: "600000"

jobs:
  prettier:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Prettier needs no build and no install scripts.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Check formatting (Prettier)
        env:
          NO_COLOR: "1"
        run: |
          if ! npm run -s prettier:check > prettier-output.txt 2>&1; then
            cat prettier-output.txt
            grep -E '^\[warn\] ' prettier-output.txt \
              | grep -vE 'Code style issues|Run Prettier|Forgot to run' \
              | sed -E 's#^\[warn\] (.+)$#::error file=\1::File is not formatted with Prettier. Run "npm run prettify" to fix.#' || true
            echo "::error::Prettier check failed. Run 'npm run prettify' locally to fix formatting."
            exit 1
          fi
          cat prettier-output.txt
