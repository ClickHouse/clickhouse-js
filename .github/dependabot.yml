# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      # One weekly PR for all action updates.
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      exclude:
        - "@clickhouse/*"
    groups:
      # One weekly PR for all npm updates. Separate PRs each touch
      # package-lock.json, so merging one makes the others conflict.
      npm:
        patterns: ["*"]
    ignore:
      # Vitest majors need a deliberate migration across all workspaces.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: ["25.3.0"]
      - dependency-name: "typescript-eslint"
        versions: ["8.56.0"]
